[package]
name = "app"
version = "1.5.0"
description = "Revect - Raster to Vector Studio"
authors = ["anes-jpg <anes-jpg@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/anes-jpg/revect"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
